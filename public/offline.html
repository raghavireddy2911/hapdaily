<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAP - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #059669 0%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      color: #ffffff;
      border: none;
      padding: 0.875rem 1.5rem;
      border-radius: 16px;
      font-size: 0.9375rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);
      transition: all 0.2s ease;
    }
    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">HAP</div>
    <div class="badge">No Internet Connection</div>
    <h1>You're Currently Offline</h1>
    <p>Please check your mobile data or Wi-Fi to browse dairy products, place orders, or record shop deliveries.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
